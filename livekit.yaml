port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # `--dev` mode (the previous docker-compose config) never advertises a
  # reachable candidate address and starts no TURN listener, so any
  # participant not on the same LAN/host as this container can complete the
  # *initial* camera/mic negotiation (often via a host or local server-reflexive
  # candidate that happens to be reachable) but fails to add a screen-share
  # track once real NATs/firewalls are involved — see docs/DEPLOYMENT.md and
  # the PR description for the investigation behind this. use_external_ip lets
  # the server discover and advertise its actual public IP via STUN.
  use_external_ip: true
turn:
  enabled: true
  # Plain UDP relay only — TURN-over-TLS needs a domain + cert, which this
  # self-hosted docker-compose setup (dev/demo use, not the production Railway
  # path) doesn't provision. This is enough to fix the "screen share (or any
  # mid-call added track) doesn't reach remote/NATed participants" symptom.
  udp_port: 3478
  # Reuse the same range docker-compose.yml already publishes for rtc.port_range
  # instead of the server's much wider 30000-40000 default, so only one UDP
  # range needs exposing on the host.
  relay_range_start: 50000
  relay_range_end: 50100
keys:
  devkey: secret
